[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "migu"
version = "0.1.0"
description = "Multimodal instruction grounding with vision, pointing gestures, and segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "mediapipe==0.10.21",
  "numpy>=1.26,<2",
  "openai>=1.75",
  "opencv-contrib-python>=4.9,<5",
  "pillow>=10",
  "pydantic>=2.7",
  "PyYAML>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
ros = [
  "rospkg>=1.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.scripts]
migu = "migu.pipeline:main"
migu-result-analysis = "migu.result_analysis:main"
migu-grounding-node = "planning_interface.grounding_node:main"
migu-gesture-monitor = "planning_interface.gesture_monitor:main"
migu-publish-instruction = "planning_interface.usr_instruction_publisher:main"
migu-bag-demo = "planning_interface.run_bag_demo:main"
migu-baseline = "baselines.runner:main"
migu-prepare-baselines = "batch_preparation.prepare:main"
migu-baseline-analysis = "baselines.metrics:main"
migu-ablation = "ablations.runner:main"

[tool.setuptools.packages.find]
include = ["migu*", "planning_interface*", "baselines*", "batch_preparation*", "ablations*"]

[tool.setuptools.package-data]
baselines = ["config.yaml"]
